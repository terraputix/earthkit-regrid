name: Windows pytest

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.11"
          python-version: 3.11
      - name: Run pytest
        run: uv run pytest tests/
